name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: mapexp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python selftest.py
      - run: python -m compileall -q settings.py storage.py geocode.py llm.py pipeline.py ingest.py web.py remap.py tools .ci
  frontend:
    name: Browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node static/ui.test.mjs
      - name: Install browser engines
        run: |
          npm install --prefix "$RUNNER_TEMP/mapexp-browser" --no-package-lock playwright-core@1.64.1
          node "$RUNNER_TEMP/mapexp-browser/node_modules/playwright-core/cli.js" install --with-deps chromium firefox webkit
      - name: Exercise all three engines with 1000 synthetic incidents
        run: |
          export MAPEXP_PLAYWRIGHT_MODULE="$RUNNER_TEMP/mapexp-browser/node_modules/playwright-core/index.mjs"
          export CHROMIUM_PATH
          CHROMIUM_PATH=$(node --input-type=module -e 'process.stdout.write((await import(process.env.MAPEXP_PLAYWRIGHT_MODULE)).chromium.executablePath())')
          mkdir -p test-results
          for engine in chromium firefox webkit; do
            MAPEXP_BROWSER="$engine" node static/render.test.mjs | tee "test-results/$engine.json"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: browser-results
          path: test-results/
  load:
    name: 1000 SSE clients
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Generate isolated data and exercise HTTP/SSE
        run: |
          ulimit -n 4096
          mkdir -p test-results
          PYTHONPATH=. python .ci/seed_demo.py --database "$RUNNER_TEMP/mapexp-load.sqlite3"
          python tools/load_test.py --database "$RUNNER_TEMP/mapexp-load.sqlite3" --users 1000 | tee test-results/load.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: load-results
          path: test-results/
  build:
    name: Build and publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, load]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate production Compose
        run: |
          mkdir -p "$RUNNER_TEMP/mapexp-config"
          cp deploy/production.env.example "$RUNNER_TEMP/mapexp-config/.env"
          MAPEXP_ROOT="$RUNNER_TEMP/mapexp-config" docker compose --env-file deploy/production.env.example -f deploy/compose.production.yml config --quiet
          docker run --rm -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build and smoke-test the exact release image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t "$IMAGE" .
          trap 'docker rm -f mapexp-ci-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name mapexp-ci-smoke -p 127.0.0.1:18010:8000 "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18010/healthz >/dev/null; then break; fi
            sleep 1
          done
          python3 tools/smoke_http.py http://127.0.0.1:18010 --expected-revision "$GITHUB_SHA"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the already-tested image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: docker push "$IMAGE"
  deploy:
    name: Deploy production
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      deployments: write
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Deploy immutable image over pinned SSH
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/mapexp-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/mapexp-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/mapexp-ssh/known_hosts"
          unset DEPLOY_SSH_KEY
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | ssh \
            -i "$RUNNER_TEMP/mapexp-ssh/key" -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/mapexp-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy "$GITHUB_SHA"
      - name: Verify public HTTPS, exact revision, gzip, ETags and SSE
        run: python3 tools/smoke_http.py "$DEPLOY_URL" --expected-revision "$GITHUB_SHA"
      - name: Remove temporary SSH files
        if: always()
        run: rm -rf "$RUNNER_TEMP/mapexp-ssh"
